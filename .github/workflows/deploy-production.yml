# ============================================================
# TECH360 — PRODUCTION CI/CD
#
#   git push origin main
#     → checkout → secret scan → install → lint → typecheck → build
#     → SSH to the VPS → scripts/deploy-vps.sh (safe deploy with
#     auto-rollback) → scripts/health-check.sh → done
#
# Requirements (GitHub → Settings → Environments → production):
#   HOSTINGER_HOST     — Hostinger SSH hostname or IP
#   HOSTINGER_USER     — Hostinger SSH user
#   HOSTINGER_SSH_KEY — the PRIVATE Hostinger deploy key (never printed)
#   HOSTINGER_PORT     — Hostinger SSH port
#   HOSTINGER_APP_PATH — optional; defaults to the verified bdtech360.com path
#   TECH360_DOMAIN    — (optional) informational, used by the deploy script
#   TECH360_PORT      — (optional) pin the port; otherwise the script
#                       DISCOVERS and PRESERVES the port the current app
#                       already listens on (never starts a second instance)
#
# The production .env stays on the VPS — the repo never ships secrets.
# ============================================================
name: deploy-production

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false   # queue, never run two deploys at once

permissions:
  contents: read

jobs:
  ci:
    name: CI — validate before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (fail before deploy if a secret slipped in)
        run: |
          echo "scanning tracked files for accidental secrets…"
          if git ls-files -z | xargs -0 grep -lIE \
            'sk_live_[A-Za-z0-9]{20,}|sk_test_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}' \
            2>/dev/null | grep -v '^\.env\.example$'; then
            echo "::error::secret-like material found in tracked files — remove it and rotate the credential"
            exit 1
          fi
          echo "clean: no secret patterns in tracked files"
          if [ -f .env ]; then echo "::error::.env must never be committed"; exit 1; fi
          echo "clean: .env not committed"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (lockfile-exact)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Business and database isolation tests
        env:
          DATABASE_URL: "file:./db/test.db"
        run: |
          rm -f db/test.db
          bunx prisma db push --skip-generate
          bun run test
          rm -f db/test.db

      - name: Checked-in database integrity (read-only)
        run: bun run db:verify

      - name: Production build
        env:
          DATABASE_URL: "file:./db/validate.db"
        run: |
          mkdir -p db && touch db/validate.db
          bunx prisma db push --skip-generate
          bun run build

  deploy:
    name: Deploy → VPS (existing port, auto-rollback)
    # Validation runs on working branches and pull requests; production deploys
    # only from a validated push to the protected default branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the deployment SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/.ssh/id_tech360
          echo "$VPS_SSH_KEY" > ~/.ssh/id_tech360
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT || 65002 }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: "Deploy on the VPS — inspect, backup, pull, build, restart, verify, rollback"
        env:
          VPS_HOST: ${{ secrets.HOSTINGER_HOST }}
          VPS_USER: ${{ secrets.HOSTINGER_USER }}
          VPS_PORT: ${{ secrets.HOSTINGER_PORT || 65002 }}
          VPS_APP_PATH: /home/u394009794/domains/bdtech360.com/public_html
          TECH360_DOMAIN: ${{ secrets.TECH360_DOMAIN }}
          TECH360_PORT: ${{ secrets.TECH360_PORT }}
        run: |
          ssh -i ~/.ssh/id_tech360 -p "${{ secrets.HOSTINGER_PORT || 65002 }}" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" -- bash -s <<'REMOTE'
          set -euo pipefail
          export VPS_APP_PATH="/home/u394009794/domains/bdtech360.com/public_html"
          cd "$VPS_APP_PATH"
          export TECH360_APP_PATH="$PWD"
          export TECH360_DOMAIN="bdtech360.com"
          # fetch the exact commit this workflow validated
          git fetch origin main
          git checkout -f origin/main
          bash scripts/deploy-vps.sh
          bash scripts/health-check.sh
          REMOTE
          echo "deployed ✅ — rollback armed for any future failure"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_tech360
