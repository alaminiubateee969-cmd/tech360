# TEMPORARY DIAGNOSTIC — reproduces the 'Business and database isolation tests (MySQL)'
# step of ci.yml (same MySQL 8.0 service, DATABASE_URL, migrate deploy and npm test) and
# posts the failing output back as a commit comment. Removed after diagnosis.
name: zz-diagnose-mysql

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_not_a_secret
          MYSQL_DATABASE: tech360_ci
          MYSQL_USER: tech360
          MYSQL_PASSWORD: ci_only_not_a_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_not_a_secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://tech360:ci_only_not_a_secret@127.0.0.1:3306/tech360_ci
      SHADOW_DATABASE_URL: mysql://root:ci_only_not_a_secret@127.0.0.1:3306/tech360_ci_shadow
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 40); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pci_only_not_a_secret --silent 2>/dev/null; then echo up; exit 0; fi
            sleep 3
          done
          exit 1
      - name: Apply migrations (as CI does)
        run: node scripts/prisma.mjs migrate deploy
      - name: Run the MySQL test step
        id: test
        run: |
          date -u
          TZ=UTC npm test > /tmp/test.log 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Post failing output to the commit
        if: always()
        run: |
          set +e
          {
            echo "### zz-diagnose-mysql run ${GITHUB_RUN_ID} (sha ${GITHUB_SHA})"
            echo "date-utc: $(date -u +%FT%TZ)  npm-test-rc: ${{ steps.test.outputs.rc }}"
            grep -E "^# (tests|pass|fail|cancelled)" /tmp/test.log
            echo "--- top-level not ok:"
            grep -E "^not ok" /tmp/test.log | head -40
            echo "--- first failure detail (subtests):"
            grep -n -m1 -E "^\s+not ok" /tmp/test.log > /tmp/first.txt
            L=$(cut -d: -f1 /tmp/first.txt)
            [ -n "$L" ] && sed -n "$((L-2)),$((L+45))p" /tmp/test.log
            echo "--- error lines:"
            grep -E "error:|Error:|AssertionError|Invalid \`|PrismaClient|ECONN|P20[0-9][0-9]" /tmp/test.log | head -60
          } > /tmp/report.md
          head -c 60000 /tmp/report.md > /tmp/report-trim.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@/tmp/report-trim.md > /dev/null && echo posted
