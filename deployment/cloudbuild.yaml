# RETIRED: do not use Cloud Build to deploy Tech360. Production deployment is
# intended to use Hostinger's Node.js Web App Git integration. This failing step
# prevents an accidental second Cloud Run app from being built/deployed.
steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-euc'
      - |
        echo 'ERROR: this Tech360 Cloud Build deployment is retired; use the Hostinger deployment runbook.' >&2
        exit 1
